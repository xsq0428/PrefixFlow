# PrefixFlow Nginx 配置
# 复制到宝塔网站设置 → 伪静态，或 include 到 Nginx 配置中

# 禁止访问敏感目录
location ~ ^/(config|includes|cache|logs|database|\.env|\.git|\.monkeycode) {
    deny all;
    return 404;
}

# API 路由
location /api/ {
    try_files $uri $uri/ /api/query.php;
}

# 后台路由
location /admin/ {
    try_files $uri $uri/ /admin/login.php;
}

# 禁止访问隐藏文件和配置文件
location ~ /\.
{
    deny all;
}

location ~ \.(sql|log|md|gitignore|env)$
{
    deny all;
}
